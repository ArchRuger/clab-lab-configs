security {
    zones {
        security-zone LAB {
            interfaces {
                all {
                    host-inbound-traffic {
                        system-services {
                            all;
                        }
                        protocols {
                            all;
                        }
                    }
                }
            }
        }
    }
    policies {
        default-policy {
            permit-all;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description to-evo-rtr3;
        vlan-tagging;
        unit 2113 {
            vlan-id 2113;
            family inet {
                address 10.21.13.2/30;
            }
        }
        unit 2123 {
            vlan-id 2123;
            family inet {
                address 10.21.23.2/30;
            }
        }
        unit 2133 {
            vlan-id 2133;
            family inet {
                address 10.21.33.2/30;
            }
        }
        unit 2143 {
            vlan-id 2143;
            family inet {
                address 10.21.43.2/30;
            }
        }
        unit 2313 {
            vlan-id 2313;
            family inet {
                address 10.23.13.2/30;
            }
        }
        unit 2323 {
            vlan-id 2323;
            family inet {
                address 10.23.23.2/30;
            }
        }
        unit 2333 {
            vlan-id 2333;
            family inet {
                address 10.23.33.2/30;
            }
        }
        unit 2343 {
            vlan-id 2343;
            family inet {
                address 10.23.43.2/30;
            }
        }
    }
}
system {
    login {
        user admin {
            authentication {
                ssh-rsa "ssh-rsa  lab-validator";
            }
        }
    }
}
