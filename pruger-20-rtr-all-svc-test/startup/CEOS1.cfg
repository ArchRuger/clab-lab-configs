hostname {{ .ShortName }}
username admin privilege 15 secret admin
username admin ssh-key ssh-rsa  lab-validator
!
service routing protocols model multi-agent
!
{{- if .Env.CLAB_MGMT_VRF }}
vrf instance {{ .Env.CLAB_MGMT_VRF }}
!
{{end}}
{{ if .MgmtIPv4Gateway }}ip route {{ if .Env.CLAB_MGMT_VRF }}vrf {{ .Env.CLAB_MGMT_VRF }} {{end}}0.0.0.0/0 {{ .MgmtIPv4Gateway }}{{end}}
{{ if .MgmtIPv6Gateway }}ipv6 route {{ if .Env.CLAB_MGMT_VRF }}vrf {{ .Env.CLAB_MGMT_VRF }} {{end}}::0/0 {{ .MgmtIPv6Gateway }}{{end}}
!
interface {{ .MgmtIntf }}
{{ if .Env.CLAB_MGMT_VRF }}   vrf {{ .Env.CLAB_MGMT_VRF }}{{end}}
{{ if .MgmtIPv4Address }}   ip address {{ .MgmtIPv4Address }}/{{.MgmtIPv4PrefixLength}}{{end}}
{{ if .MgmtIPv6Address }}   ipv6 address {{ .MgmtIPv6Address }}/{{.MgmtIPv6PrefixLength}}{{end}}
!
management api gnmi
   transport grpc default
{{ if .Env.CLAB_MGMT_VRF }}      vrf {{ .Env.CLAB_MGMT_VRF }}{{end}}
!
management api netconf
   transport ssh default
{{ if .Env.CLAB_MGMT_VRF }}      vrf {{ .Env.CLAB_MGMT_VRF }}{{end}}
!
management api http-commands
   no shutdown
{{- if .Env.CLAB_MGMT_VRF }}
   !
   vrf {{ .Env.CLAB_MGMT_VRF }}
      no shutdown
{{end}}
!
mpls label range static 16 15984
mpls label range isis-sr 16000 8000
ip routing
mpls ip
vrf instance L3VPN-A
ip routing vrf L3VPN-A
vlan 110,240
!
interface Loopback0
   ip address 10.255.0.31/32
   isis enable CORE
   node-segment ipv4 index 31
!
interface Ethernet2
   description to vjunos-SW1
   no switchport
   ip address 10.1.0.3/29
   isis enable CORE
   isis hello padding disabled
   mpls ip
!
interface Ethernet1
   description to srx1
   switchport mode trunk
   switchport trunk allowed vlan 110,240
!
interface Vlan110
   vrf L3VPN-A
   ip address 10.110.0.65/30
!
router isis CORE
   net 49.0001.0000.0000.0031.00
   is-type level-2
   router-id ipv4 10.255.0.31
   address-family ipv4 unicast
   !
   segment-routing mpls
      no shutdown
!
router bgp 65000
   router-id 10.255.0.31
   no bgp default ipv4-unicast
   neighbor RR peer group
   neighbor RR remote-as 65000
   neighbor RR update-source Loopback0
   neighbor RR send-community
   neighbor 10.255.0.1 peer group RR
   neighbor 10.255.0.2 peer group RR
   !
   address-family vpn-ipv4
      neighbor RR activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
   !
   address-family evpn
      neighbor RR activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
   !
   vlan 240
      rd 10.255.0.31:240
      route-target both 65000:240
      redistribute learned
   !
   vrf L3VPN-A
      rd 10.255.0.31:100
      route-target import vpn-ipv4 65000:100
      route-target export vpn-ipv4 65000:100
      neighbor 10.110.0.66 remote-as 65201
      redistribute connected
      !
      address-family ipv4
         neighbor 10.110.0.66 activate
!
end
