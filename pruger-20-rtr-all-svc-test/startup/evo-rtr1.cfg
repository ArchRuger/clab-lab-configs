            root-login allow;
        }
    }
    login {
        user admin {
            class super-user;
            authentication {
                encrypted-password "$6$clabevo1$ROGr.rRd3LGKnkRKpQPOSOup5gp0IJROu0hrwYLE0kKZ06vCpDdD36fRNGHV53UjoG4E.DZuSMa6CXpE12kN70";
                ssh-rsa "ssh-rsa  lab-validator";
            }
        }
