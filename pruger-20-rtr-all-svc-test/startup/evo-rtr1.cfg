interfaces {
    re0:mgmt-0 {
        unit 0 {
            family inet {
                address FXP0ADDR;
            }
        }
    }
    et-0/0/0 {
        description to-vjunos-SW1;
        unit 0 {
            family inet {
                address 10.1.0.2/29;
            }
            family iso;
            family mpls;
        }
    }
    et-0/0/1 {
        description to-vjunos-SW4;
        unit 0 {
            family inet {
                address 10.1.0.26/29;
            }
            family iso;
            family mpls;
        }
    }
    et-0/0/2 {
        description to-srx1;
        unit 0 {
            family inet {
                address 10.110.0.33/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.21/32;
            }
            family iso {
                address 49.0001.0000.0000.0021.00;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.21;
    autonomous-system 65000;
}
protocols {
    mpls {
        label-range {
            srgb-label-range 16000 23999;
        }
        interface et-0/0/0.0;
        interface et-0/0/1.0;
    }
    isis {
        level 1 {
            disable;
        }
        level 2 {
            wide-metrics-only;
        }
        interface lo0.0 {
            passive;
        }
        source-packet-routing {
            node-segment {
                ipv4-index 21;
            }
        }
        interface et-0/0/0.0 {
            hello-padding disable;
            level 2 {
                priority 127;
            }
        }
        interface et-0/0/1.0 {
            hello-padding disable;
            level 2 {
                priority 127;
            }
        }
    }
    bgp {
        group RR {
            type internal;
            local-address 10.255.0.21;
            family inet-vpn {
                unicast;
            }
            neighbor 10.255.0.1;
            neighbor 10.255.0.2;
        }
    }
}
routing-instances {
    L3VPN-A {
        instance-type vrf;
        interface et-0/0/2.0;
        route-distinguisher 10.255.0.21:100;
        vrf-target target:65000:100;
        vrf-table-label;
        protocols {
            bgp {
                group CE {
                    type external;
                    peer-as 65201;
                    neighbor 10.110.0.34;
                }
            }
        }
    }
}
