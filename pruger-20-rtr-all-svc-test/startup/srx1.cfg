security {
    zones {
        security-zone LAB {
            interfaces {
                all {
                    host-inbound-traffic {
                        system-services {
                            all;
                        }
                        protocols {
                            all;
                        }
                    }
                }
            }
        }
    }
    policies {
        default-policy {
            permit-all;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description to-evo-rtr1;
        unit 0 {
            family inet {
                address 10.110.0.34/30;
            }
        }
    }
    ge-0/0/1 {
        description to-CEOS1;
        vlan-tagging;
        unit 110 {
            vlan-id 110;
            family inet {
                address 10.110.0.66/30;
            }
        }
        unit 240 {
            vlan-id 240;
            family inet {
                address 10.240.0.51/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 172.16.0.51/32;
            }
        }
    }
}
routing-options {
    router-id 172.16.0.51;
    autonomous-system 65201;
}
policy-options {
    policy-statement CE-LO {
        term 1 {
            from {
                route-filter 172.16.0.51/32 exact;
            }
            then {
                accept;
            }
        }
        term 2 {
            then {
                reject;
            }
        }
    }
}
protocols {
    bgp {
        group PE {
            type external;
            peer-as 65000;
            export CE-LO;
            neighbor 10.110.0.33;
            neighbor 10.110.0.65;
        }
    }
}
system {
    login {
        user admin {
            authentication {
                ssh-rsa "ssh-rsa  lab-validator";
            }
        }
    }
}
