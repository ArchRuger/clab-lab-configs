chassis {
    network-services enhanced-ip;
}
routing-options {
    router-id 10.255.0.13;
    autonomous-system 65000;
}
protocols {
    mpls {
        label-range {
            srgb-label-range 16000 23999;
        }
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
        interface ge-0/0/2.100;
    }
    isis {
        level 1 {
            disable;
        }
        level 2 {
            wide-metrics-only;
        }
        interface lo0.0 {
            passive;
        }
        source-packet-routing {
            node-segment {
                ipv4-index 13;
            }
        }
        interface ge-0/0/0.0 {
            point-to-point;
            hello-padding disable;
        }
        interface ge-0/0/1.0 {
            point-to-point;
            hello-padding disable;
        }
        interface ge-0/0/2.100 {
            hello-padding disable;
        }
    }
    ldp {
        interface lo0.0;
    }
    bgp {
        group RR {
            type internal;
            local-address 10.255.0.13;
            family inet-vpn {
                unicast;
            }
            family evpn {
                signaling;
            }
            neighbor 10.255.0.1;
            neighbor 10.255.0.2;
        }
    }
    l2circuit {
        neighbor 10.255.0.11 {
            interface ge-0/0/2.210 {
                virtual-circuit-id 210;
            }
        }
        neighbor 10.255.0.2 {
            interface ge-0/0/4.2112 {
                virtual-circuit-id 2112;
                encapsulation-type ethernet;
                no-control-word;
                mtu 1500;
            }
        }
        neighbor 10.255.0.12 {
            interface ge-0/0/4.2122 {
                virtual-circuit-id 2122;
                encapsulation-type ethernet;
                no-control-word;
                mtu 1500;
            }
        }
        neighbor 10.255.0.22 {
            interface ge-0/0/4.2132 {
                virtual-circuit-id 2132;
                encapsulation-type ethernet;
                no-control-word;
                mtu 1500;
            }
        }
        neighbor 10.255.0.32 {
            interface ge-0/0/4.2142 {
                virtual-circuit-id 2142;
                encapsulation-type ethernet;
                no-control-word;
                mtu 1500;
            }
        }
    }
}
routing-instances {
    L3VPN-A {
        instance-type vrf;
        interface ge-0/0/2.110;
        route-distinguisher 10.255.0.13:100;
        vrf-target target:65000:100;
        vrf-table-label;
        protocols {
            bgp {
                group CE {
                    type external;
                    peer-as 65103;
                    neighbor 10.110.0.10;
                }
                group EP {
                    type external;
                    neighbor 10.111.0.30 {
                        peer-as 65307;
                    }
                }
            }
        }
        interface ge-0/0/3.111;
    }
    VPLS-220 {
        instance-type vpls;
        interface ge-0/0/2.220;
        protocols {
            vpls {
                vpls-id 220;
                no-tunnel-services;
                neighbor 10.255.0.11;
                neighbor 10.255.0.12;
                neighbor 10.255.0.14;
                neighbor 10.255.0.2;
                neighbor 10.255.0.3;
                neighbor 10.255.0.22;
                neighbor 10.255.0.23;
                neighbor 10.255.0.32;
                neighbor 10.255.0.33;
            }
        }
        vlan-id none;
        interface ge-0/0/3.220;
    }
    EVPN-VPWS-230 {
        instance-type evpn-vpws;
        interface ge-0/0/2.230;
        route-distinguisher 10.255.0.13:230;
        vrf-target target:65000:231;
        protocols {
            evpn {
                interface ge-0/0/2.230 {
                    vpws-service-id {
                        local 2;
                        remote 1;
                    }
                }
            }
        }
    }
    EVPN-240 {
        instance-type evpn;
        vlan-id none;
        interface ge-0/0/2.240;
        route-distinguisher 10.255.0.13:240;
        vrf-target target:65000:240;
        protocols {
            evpn {
                interface ge-0/0/2.240;
                control-word;
                interface ge-0/0/3.240;
            }
        }
        interface ge-0/0/3.240;
    }
    VPWS-2312 {
        instance-type evpn-vpws;
        interface ge-0/0/4.2312;
        route-distinguisher 10.255.0.13:2312;
        vrf-target target:65000:2312;
        protocols {
            evpn {
                interface ge-0/0/4.2312 {
                    vpws-service-id {
                        local 2;
                        remote 1;
                    }
                }
            }
        }
    }
    VPWS-2322 {
        instance-type evpn-vpws;
        interface ge-0/0/4.2322;
        route-distinguisher 10.255.0.13:2322;
        vrf-target target:65000:2322;
        protocols {
            evpn {
                interface ge-0/0/4.2322 {
                    vpws-service-id {
                        local 2;
                        remote 1;
                    }
                }
            }
        }
    }
    VPWS-2332 {
        instance-type evpn-vpws;
        interface ge-0/0/4.2332;
        route-distinguisher 10.255.0.13:2332;
        vrf-target target:65000:2332;
        protocols {
            evpn {
                interface ge-0/0/4.2332 {
                    vpws-service-id {
                        local 2;
                        remote 1;
                    }
                }
            }
        }
    }
    VPWS-2342 {
        instance-type evpn-vpws;
        interface ge-0/0/4.2342;
        route-distinguisher 10.255.0.13:2342;
        vrf-target target:65000:2342;
        protocols {
            evpn {
                interface ge-0/0/4.2342 {
                    vpws-service-id {
                        local 2;
