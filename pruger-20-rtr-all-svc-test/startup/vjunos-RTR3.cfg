interfaces {
    ge-0/0/0 {
        description to-xrv-rtr3;
        unit 0 {
            family inet {
                address 10.0.0.10/31;
            }
            family iso;
            family mpls;
        }
    }
    ge-0/0/1 {
        description to-vjunos-RTR4;
        unit 0 {
            family inet {
                address 10.0.0.16/31;
            }
            family iso;
            family mpls;
        }
    }
    ge-0/0/2 {
        description to-vjunos-SW3;
        flexible-vlan-tagging;
        encapsulation flexible-ethernet-services;
        unit 100 {
            vlan-id 100;
            family inet {
                address 10.1.0.17/29;
            }
            family iso;
            family mpls;
        }
        unit 110 {
            vlan-id 110;
            family inet {
                address 10.110.0.9/30;
            }
        }
        unit 210 {
            encapsulation vlan-ccc;
            vlan-id 210;
        }
        unit 220 {
            encapsulation vlan-vpls;
            vlan-id 220;
        }
        unit 230 {
            encapsulation vlan-ccc;
            vlan-id 230;
        }
        unit 240 {
            encapsulation vlan-bridge;
            vlan-id 240;
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.13/32;
            }
            family iso {
                address 49.0001.0000.0000.0013.00;
            }
        }
    }
    ge-0/0/3 {
        description to-srx7;
        flexible-vlan-tagging;
        encapsulation flexible-ethernet-services;
        unit 111 {
            vlan-id 111;
            family inet {
                address 10.111.0.29/30;
            }
        }
        unit 220 {
            encapsulation vlan-vpls;
            vlan-id 220;
        }
        unit 240 {
            encapsulation vlan-bridge;
            vlan-id 240;
        }
    }
    ge-0/0/4 {
        description to-srx12;
        flexible-vlan-tagging;
        encapsulation flexible-ethernet-services;
        unit 2112 {
            encapsulation vlan-ccc;
            vlan-id 2112;
