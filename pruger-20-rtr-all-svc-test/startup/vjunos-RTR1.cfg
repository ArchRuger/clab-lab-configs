interfaces {
    ge-0/0/0 {
        description to-xrv-rtr1;
        unit 0 {
            family inet {
                address 10.0.0.6/31;
            }
            family iso;
            family mpls;
        }
    }
    ge-0/0/1 {
        description to-vjunos-RTR2;
        unit 0 {
            family inet {
                address 10.0.0.14/31;
            }
            family iso;
            family mpls;
        }
    }
    ge-0/0/2 {
        description to-vjunos-SW1;
        flexible-vlan-tagging;
        encapsulation flexible-ethernet-services;
        unit 100 {
            vlan-id 100;
            family inet {
                address 10.1.0.1/29;
            }
            family iso;
            family mpls;
        }
        unit 110 {
            vlan-id 110;
            family inet {
                address 10.110.0.1/30;
            }
        }
        unit 210 {
            encapsulation vlan-ccc;
            vlan-id 210;
        }
        unit 220 {
            encapsulation vlan-vpls;
            vlan-id 220;
        }
        unit 230 {
            encapsulation vlan-ccc;
            vlan-id 230;
        }
        unit 240 {
            encapsulation vlan-bridge;
            vlan-id 240;
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.11/32;
            }
            family iso {
                address 49.0001.0000.0000.0011.00;
            }
        }
    }
}
chassis {
    network-services enhanced-ip;
}
routing-options {
    router-id 10.255.0.11;
    autonomous-system 65000;
}
protocols {
    mpls {
        label-range {
            srgb-label-range 16000 23999;
        }
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
        interface ge-0/0/2.100;
    }
    isis {
        level 1 {
            disable;
        }
        level 2 {
            wide-metrics-only;
        }
        interface lo0.0 {
            passive;
        }
        source-packet-routing {
            node-segment {
                ipv4-index 11;
            }
        }
        interface ge-0/0/0.0 {
            point-to-point;
            hello-padding disable;
        }
        interface ge-0/0/1.0 {
            point-to-point;
            hello-padding disable;
        }
        interface ge-0/0/2.100 {
            hello-padding disable;
        }
    }
    ldp {
        interface lo0.0;
    }
    bgp {
        group RR {
            type internal;
            local-address 10.255.0.11;
            family inet-vpn {
                unicast;
            }
            family evpn {
                signaling;
            }
            neighbor 10.255.0.1;
            neighbor 10.255.0.2;
        }
    }
    l2circuit {
        neighbor 10.255.0.13 {
            interface ge-0/0/2.210 {
                virtual-circuit-id 210;
            }
        }
    }
}
routing-instances {
    L3VPN-A {
        instance-type vrf;
        interface ge-0/0/2.110;
        route-distinguisher 10.255.0.11:100;
        vrf-target target:65000:100;
        vrf-table-label;
        protocols {
            bgp {
                group CE {
                    type external;
                    peer-as 65101;
                    neighbor 10.110.0.2;
                }
            }
        }
    }
    VPLS-220 {
        instance-type vpls;
        interface ge-0/0/2.220;
        protocols {
            vpls {
                vpls-id 220;
                no-tunnel-services;
                neighbor 10.255.0.12;
                neighbor 10.255.0.13;
                neighbor 10.255.0.14;
                neighbor 10.255.0.2;
                neighbor 10.255.0.3;
                neighbor 10.255.0.22;
                neighbor 10.255.0.23;
                neighbor 10.255.0.32;
                neighbor 10.255.0.33;
            }
        }
        vlan-id none;
    }
    EVPN-VPWS-230 {
        instance-type evpn-vpws;
        interface ge-0/0/2.230;
        route-distinguisher 10.255.0.11:230;
        vrf-target target:65000:230;
        protocols {
            evpn {
                interface ge-0/0/2.230 {
                    vpws-service-id {
                        local 1;
                        remote 2;
                    }
                }
            }
        }
    }
    EVPN-240 {
        instance-type evpn;
        vlan-id none;
        interface ge-0/0/2.240;
        route-distinguisher 10.255.0.11:240;
        vrf-target target:65000:240;
        protocols {
            evpn {
                interface ge-0/0/2.240;
                control-word;
            }
        }
    }
}
system {
    login {
        user admin {
            authentication {
                ssh-rsa "ssh-rsa  lab-validator";
            }
        }
    }
}
