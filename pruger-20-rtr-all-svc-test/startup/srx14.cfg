security {
    zones {
        security-zone LAB {
            interfaces {
                all {
                    host-inbound-traffic {
                        system-services {
                            all;
                        }
                        protocols {
                            all;
                        }
                    }
                }
            }
        }
    }
    policies {
        default-policy {
            permit-all;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description to-CEOS2;
        vlan-tagging;
        unit 2141 {
            vlan-id 2141;
            family inet {
                address 10.21.41.1/30;
            }
        }
        unit 2142 {
            vlan-id 2142;
            family inet {
                address 10.21.42.1/30;
            }
        }
        unit 2143 {
