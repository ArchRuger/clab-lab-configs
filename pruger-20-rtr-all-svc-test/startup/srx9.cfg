security {
    zones {
        security-zone LAB {
            interfaces {
                all {
                    host-inbound-traffic {
                        system-services {
                            all;
                        }
                        protocols {
                            all;
                        }
                    }
                }
            }
        }
    }
    policies {
        default-policy {
            permit-all;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description to-CEOS3;
        vlan-tagging;
        unit 2114 {
            vlan-id 2114;
            family inet {
                address 10.21.14.2/30;
            }
        }
        unit 2124 {
            vlan-id 2124;
            family inet {
                address 10.21.24.2/30;
            }
        }
        unit 2134 {
            vlan-id 2134;
            family inet {
                address 10.21.34.2/30;
            }
        }
        unit 2144 {
            vlan-id 2144;
            family inet {
                address 10.21.44.2/30;
            }
        }
        unit 2314 {
            vlan-id 2314;
            family inet {
                address 10.23.14.2/30;
            }
        }
        unit 2324 {
            vlan-id 2324;
            family inet {
                address 10.23.24.2/30;
            }
        }
        unit 2334 {
            vlan-id 2334;
            family inet {
