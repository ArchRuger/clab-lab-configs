chassis {
    network-services enhanced-ip;
}
routing-options {
    router-id 10.255.0.12;
    autonomous-system 65000;
}
protocols {
    mpls {
        label-range {
            srgb-label-range 16000 23999;
        }
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
        interface ge-0/0/2.100;
    }
    isis {
        level 1 {
            disable;
        }
        level 2 {
            wide-metrics-only;
        }
        interface lo0.0 {
            passive;
        }
        source-packet-routing {
            node-segment {
                ipv4-index 12;
            }
        }
        interface ge-0/0/0.0 {
            point-to-point;
            hello-padding disable;
        }
        interface ge-0/0/1.0 {
            point-to-point;
            hello-padding disable;
        }
        interface ge-0/0/2.100 {
            hello-padding disable;
        }
    }
    ldp {
        interface lo0.0;
    }
    bgp {
        group RR {
            type internal;
            local-address 10.255.0.12;
            family inet-vpn {
                unicast;
            }
            family evpn {
                signaling;
            }
            neighbor 10.255.0.1;
            neighbor 10.255.0.2;
        }
    }
    l2circuit {
        neighbor 10.255.0.14 {
            interface ge-0/0/2.210 {
                virtual-circuit-id 211;
            }
        }
        neighbor 10.255.0.3 {
            interface ge-0/0/4.2121 {
                virtual-circuit-id 2121;
                encapsulation-type ethernet;
                no-control-word;
                mtu 1500;
            }
        }
        neighbor 10.255.0.13 {
            interface ge-0/0/4.2122 {
                virtual-circuit-id 2122;
                encapsulation-type ethernet;
                no-control-word;
                mtu 1500;
            }
        }
        neighbor 10.255.0.23 {
            interface ge-0/0/4.2123 {
                virtual-circuit-id 2123;
                encapsulation-type ethernet;
                no-control-word;
                mtu 1500;
            }
        }
        neighbor 10.255.0.33 {
            interface ge-0/0/4.2124 {
                virtual-circuit-id 2124;
                encapsulation-type ethernet;
                no-control-word;
                mtu 1500;
            }
        }
    }
}
routing-instances {
    L3VPN-A {
        instance-type vrf;
        interface ge-0/0/2.110;
        route-distinguisher 10.255.0.12:100;
        vrf-target target:65000:100;
        vrf-table-label;
        protocols {
            bgp {
                group CE {
                    type external;
                    peer-as 65102;
                    neighbor 10.110.0.6;
                }
                group EP {
                    type external;
                    neighbor 10.111.0.90 {
                        peer-as 65322;
                    }
                }
            }
        }
        interface ge-0/0/3.111;
    }
    VPLS-220 {
        instance-type vpls;
        interface ge-0/0/2.220;
        protocols {
            vpls {
                vpls-id 220;
                no-tunnel-services;
                neighbor 10.255.0.11;
                neighbor 10.255.0.13;
                neighbor 10.255.0.14;
                neighbor 10.255.0.2;
                neighbor 10.255.0.3;
                neighbor 10.255.0.22;
                neighbor 10.255.0.23;
                neighbor 10.255.0.32;
                neighbor 10.255.0.33;
            }
        }
        vlan-id none;
        interface ge-0/0/3.220;
    }
    EVPN-VPWS-230 {
        instance-type evpn-vpws;
        interface ge-0/0/2.230;
        route-distinguisher 10.255.0.12:230;
        vrf-target target:65000:231;
        protocols {
            evpn {
                interface ge-0/0/2.230 {
                    vpws-service-id {
                        local 1;
                        remote 2;
                    }
                }
            }
        }
    }
    EVPN-240 {
        instance-type evpn;
        vlan-id none;
        interface ge-0/0/2.240;
        route-distinguisher 10.255.0.12:240;
        vrf-target target:65000:240;
        protocols {
            evpn {
                interface ge-0/0/2.240;
                control-word;
                interface ge-0/0/3.240;
            }
        }
        interface ge-0/0/3.240;
    }
    VPWS-2321 {
        instance-type evpn-vpws;
        interface ge-0/0/4.2321;
        route-distinguisher 10.255.0.12:2321;
        vrf-target target:65000:2321;
        protocols {
            evpn {
                interface ge-0/0/4.2321 {
                    vpws-service-id {
                        local 1;
                        remote 2;
                    }
                }
            }
        }
    }
    VPWS-2322 {
        instance-type evpn-vpws;
        interface ge-0/0/4.2322;
        route-distinguisher 10.255.0.12:2322;
        vrf-target target:65000:2322;
        protocols {
            evpn {
                interface ge-0/0/4.2322 {
                    vpws-service-id {
                        local 1;
                        remote 2;
                    }
                }
            }
        }
    }
    VPWS-2323 {
        instance-type evpn-vpws;
        interface ge-0/0/4.2323;
        route-distinguisher 10.255.0.12:2323;
        vrf-target target:65000:2323;
        protocols {
            evpn {
                interface ge-0/0/4.2323 {
                    vpws-service-id {
                        local 1;
                        remote 2;
                    }
                }
            }
        }
    }
    VPWS-2324 {
        instance-type evpn-vpws;
        interface ge-0/0/4.2324;
        route-distinguisher 10.255.0.12:2324;
        vrf-target target:65000:2324;
        protocols {
            evpn {
                interface ge-0/0/4.2324 {
                    vpws-service-id {
                        local 1;
                        remote 2;
                    }
                }
            }
        }
    }
}
