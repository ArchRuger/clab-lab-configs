security {
    zones {
        security-zone LAB {
            interfaces {
                all {
                    host-inbound-traffic {
                        system-services {
                            all;
                        }
                        protocols {
                            all;
                        }
                    }
                }
            }
        }
    }
    policies {
        default-policy {
            permit-all;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description to-vjunos-RTR2;
        vlan-tagging;
        unit 2121 {
            vlan-id 2121;
            family inet {
                address 10.21.21.1/30;
            }
        }
        unit 2122 {
            vlan-id 2122;
            family inet {
                address 10.21.22.1/30;
            }
        }
        unit 2123 {
            vlan-id 2123;
            family inet {
                address 10.21.23.1/30;
            }
        }
        unit 2124 {
            vlan-id 2124;
            family inet {
                address 10.21.24.1/30;
            }
        }
        unit 2321 {
            vlan-id 2321;
            family inet {
                address 10.23.21.1/30;
            }
        }
        unit 2322 {
            vlan-id 2322;
            family inet {
                address 10.23.22.1/30;
            }
        }
        unit 2323 {
            vlan-id 2323;
            family inet {
                address 10.23.23.1/30;
            }
        }
        unit 2324 {
            vlan-id 2324;
            family inet {
                address 10.23.24.1/30;
            }
        }
    }
}
system {
    login {
        user admin {
            authentication {
                ssh-rsa "ssh-rsa  lab-validator";
            }
        }
    }
}
