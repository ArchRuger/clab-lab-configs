security {
    zones {
        security-zone LAB {
            interfaces {
                all {
                    host-inbound-traffic {
                        system-services {
                            all;
                        }
                        protocols {
                            all;
                        }
                    }
                }
            }
        }
    }
    policies {
        default-policy {
            permit-all;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description to-xrv-rtr3;
        vlan-tagging;
        unit 2111 {
            vlan-id 2111;
            family inet {
                address 10.21.11.2/30;
            }
        }
        unit 2121 {
            vlan-id 2121;
            family inet {
                address 10.21.21.2/30;
            }
        }
        unit 2131 {
            vlan-id 2131;
            family inet {
                address 10.21.31.2/30;
            }
        }
        unit 2141 {
            vlan-id 2141;
            family inet {
                address 10.21.41.2/30;
            }
        }
        unit 2311 {
            vlan-id 2311;
            family inet {
                address 10.23.11.2/30;
            }
        }
        unit 2321 {
            vlan-id 2321;
            family inet {
                address 10.23.21.2/30;
            }
        }
        unit 2331 {
            vlan-id 2331;
            family inet {
                address 10.23.31.2/30;
            }
        }
        unit 2341 {
            vlan-id 2341;
            family inet {
                address 10.23.41.2/30;
            }
        }
    }
}
system {
    login {
        user admin {
            authentication {
                ssh-rsa "ssh-rsa  lab-validator";
            }
        }
    }
}
