vlans {
    CORE {
        vlan-id 100;
    }
    V110 {
        vlan-id 110;
        l3-interface irb.110;
    }
    V210 {
        vlan-id 210;
        l3-interface irb.210;
    }
    V220 {
        vlan-id 220;
        l3-interface irb.220;
    }
    V230 {
        vlan-id 230;
        l3-interface irb.230;
    }
    V240 {
        vlan-id 240;
        l3-interface irb.240;
    }
}
interfaces {
    irb {
        unit 110 {
            family inet {
                address 10.110.0.6/30;
            }
        }
        unit 210 {
            family inet {
                address 10.210.0.9/29;
            }
        }
        unit 220 {
            family inet {
                address 10.220.0.2/24;
            }
        }
        unit 230 {
            family inet {
                address 10.230.0.9/29;
            }
        }
        unit 240 {
            family inet {
                address 10.240.0.42/24;
            }
        }
    }
    ge-0/0/0 {
        description to-vjunos-RTR2;
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ CORE V110 V210 V220 V230 V240 ];
                }
            }
        }
    }
    ge-0/0/1 {
        description to-evo-rtr2;
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members CORE;
                }
            }
        }
    }
    ge-0/0/2 {
        description to-CEOS2;
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members CORE;
                }
            }
        }
    }
    lo0 {
        unit 110 {
            family inet {
                address 172.16.0.42/32;
            }
        }
    }
}
routing-instances {
    CE {
        interface irb.110;
        interface irb.210;
        interface irb.220;
        interface irb.230;
        interface irb.240;
        instance-type virtual-router;
        interface lo0.110;
        routing-options {
            router-id 172.16.0.42;
            autonomous-system 65102;
        }
        protocols {
            bgp {
                group PE {
                    type external;
                    peer-as 65000;
                    export CE-LO;
                    neighbor 10.110.0.5;
                }
            }
        }
    }
}
policy-options {
    policy-statement CE-LO {
        term 1 {
            from {
                route-filter 172.16.0.42/32 exact;
            }
            then {
                accept;
            }
        }
        term 2 {
            then {
                reject;
            }
        }
    }
}
system {
    login {
        user admin {
            authentication {
                ssh-rsa "ssh-rsa  lab-validator";
            }
        }
    }
}
