security {
    zones {
        security-zone LAB {
            interfaces {
                all {
                    host-inbound-traffic {
                        system-services {
                            all;
                        }
                        protocols {
                            all;
                        }
                    }
                }
            }
        }
    }
    policies {
        default-policy {
            permit-all;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description to-xrv-rtr2;
        vlan-tagging;
        unit 2111 {
            vlan-id 2111;
            family inet {
                address 10.21.11.1/30;
            }
        }
        unit 2112 {
            vlan-id 2112;
            family inet {
                address 10.21.12.1/30;
            }
        }
        unit 2113 {
            vlan-id 2113;
            family inet {
                address 10.21.13.1/30;
            }
        }
        unit 2114 {
            vlan-id 2114;
            family inet {
                address 10.21.14.1/30;
            }
        }
        unit 2311 {
            vlan-id 2311;
            family inet {
                address 10.23.11.1/30;
            }
        }
        unit 2312 {
            vlan-id 2312;
            family inet {
                address 10.23.12.1/30;
            }
        }
        unit 2313 {
            vlan-id 2313;
            family inet {
                address 10.23.13.1/30;
            }
        }
        unit 2314 {
            vlan-id 2314;
            family inet {
                address 10.23.14.1/30;
            }
        }
    }
}
system {
    login {
        user admin {
            authentication {
                ssh-rsa "ssh-rsa  lab-validator";
            }
        }
    }
}
