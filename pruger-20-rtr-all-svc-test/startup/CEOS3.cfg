hostname {{ .ShortName }}
username admin privilege 15 secret admin
username admin ssh-key ssh-rsa  lab-validator
!
service routing protocols model multi-agent
!
{{- if .Env.CLAB_MGMT_VRF }}
vrf instance {{ .Env.CLAB_MGMT_VRF }}
!
{{end}}
{{ if .MgmtIPv4Gateway }}ip route {{ if .Env.CLAB_MGMT_VRF }}vrf {{ .Env.CLAB_MGMT_VRF }} {{end}}0.0.0.0/0 {{ .MgmtIPv4Gateway }}{{end}}
{{ if .MgmtIPv6Gateway }}ipv6 route {{ if .Env.CLAB_MGMT_VRF }}vrf {{ .Env.CLAB_MGMT_VRF }} {{end}}::0/0 {{ .MgmtIPv6Gateway }}{{end}}
!
interface {{ .MgmtIntf }}
{{ if .Env.CLAB_MGMT_VRF }}   vrf {{ .Env.CLAB_MGMT_VRF }}{{end}}
{{ if .MgmtIPv4Address }}   ip address {{ .MgmtIPv4Address }}/{{.MgmtIPv4PrefixLength}}{{end}}
{{ if .MgmtIPv6Address }}   ipv6 address {{ .MgmtIPv6Address }}/{{.MgmtIPv6PrefixLength}}{{end}}
!
management api gnmi
   transport grpc default
{{ if .Env.CLAB_MGMT_VRF }}      vrf {{ .Env.CLAB_MGMT_VRF }}{{end}}
!
management api netconf
   transport ssh default
{{ if .Env.CLAB_MGMT_VRF }}      vrf {{ .Env.CLAB_MGMT_VRF }}{{end}}
!
management api http-commands
   no shutdown
{{- if .Env.CLAB_MGMT_VRF }}
   !
   vrf {{ .Env.CLAB_MGMT_VRF }}
      no shutdown
{{end}}
!
vlan 111,220
!
mpls label range static 16 15984
mpls label range isis-sr 16000 8000
ip routing
mpls ip
vrf instance L3VPN-A
ip routing vrf L3VPN-A
vlan 110,240
!
interface Loopback0
   ip address 10.255.0.33/32
   isis enable CORE
   node-segment ipv4 index 33
!
interface Ethernet2
   description to vjunos-SW3
   no switchport
   ip address 10.1.0.19/29
   isis enable CORE
   isis hello padding disabled
   mpls ip
!
interface Ethernet1
   description to srx3
   switchport mode trunk
   switchport trunk allowed vlan 110,240
!
interface Vlan110
   vrf L3VPN-A
   ip address 10.110.0.73/30
!
router isis CORE
   net 49.0001.0000.0000.0033.00
   is-type level-2
   router-id ipv4 10.255.0.33
   address-family ipv4 unicast
   !
   segment-routing mpls
      no shutdown
!
router bgp 65000
   router-id 10.255.0.33
   no bgp default ipv4-unicast
   neighbor RR peer group
   neighbor RR remote-as 65000
   neighbor RR update-source Loopback0
   neighbor RR send-community
   neighbor 10.255.0.1 peer group RR
   neighbor 10.255.0.2 peer group RR
   !
   address-family vpn-ipv4
      neighbor RR activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
   !
   address-family evpn
      neighbor RR activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
   !
   vlan 240
      rd 10.255.0.33:240
      route-target both 65000:240
      redistribute learned
   !
   vrf L3VPN-A
      rd 10.255.0.33:100
      route-target import vpn-ipv4 65000:100
      route-target export vpn-ipv4 65000:100
      neighbor 10.110.0.74 remote-as 65203
      redistribute connected
      !
      address-family ipv4
         neighbor 10.110.0.74 activate
!
interface Ethernet3
   description to srx4
   switchport mode trunk
   switchport trunk allowed vlan 111,220,240
interface Vlan111
   vrf L3VPN-A
   ip address 10.111.0.17/30
router bgp 65000
   vrf L3VPN-A
      neighbor 10.111.0.18 remote-as 65304
      address-family ipv4
         neighbor 10.111.0.18 activate
!
mpls ldp
   router-id 10.255.0.33
   transport-address interface Loopback0
   interface disabled default
   no shutdown
   pseudowires
      pseudowire VPLS220-vjunos-RTR1
         neighbor 10.255.0.11
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-vjunos-RTR2
         neighbor 10.255.0.12
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-vjunos-RTR3
         neighbor 10.255.0.13
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-vjunos-RTR4
         neighbor 10.255.0.14
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-xrv-rtr2
         neighbor 10.255.0.2
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-xrv-rtr3
         neighbor 10.255.0.3
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-evo-rtr2
         neighbor 10.255.0.22
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-evo-rtr3
         neighbor 10.255.0.23
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-CEOS2
         neighbor 10.255.0.32
         pseudowire-id 220
         mtu 1500
router vpls
   vpls VPLS-220
      vlan 220
      pseudowire ldp MESH split-horizon
         pseudowire VPLS220-vjunos-RTR1
         pseudowire VPLS220-vjunos-RTR2
         pseudowire VPLS220-vjunos-RTR3
         pseudowire VPLS220-vjunos-RTR4
         pseudowire VPLS220-xrv-rtr2
         pseudowire VPLS220-xrv-rtr3
         pseudowire VPLS220-evo-rtr2
         pseudowire VPLS220-evo-rtr3
         pseudowire VPLS220-CEOS2
!
interface Ethernet4
   description to srx9
   no switchport
interface Ethernet4.2114
   encapsulation dot1q vlan 2114
interface Ethernet4.2314
   encapsulation dot1q vlan 2314
interface Ethernet4.2124
   encapsulation dot1q vlan 2124
interface Ethernet4.2324
   encapsulation dot1q vlan 2324
interface Ethernet4.2134
   encapsulation dot1q vlan 2134
interface Ethernet4.2334
   encapsulation dot1q vlan 2334
interface Ethernet4.2144
   encapsulation dot1q vlan 2144
interface Ethernet4.2344
   encapsulation dot1q vlan 2344
exit
!
mpls ldp
   router-id 10.255.0.33
   transport-address interface Loopback0
   interface disabled default
   no shutdown
   pseudowires
      pseudowire PW2114
         neighbor 10.255.0.2
         pseudowire-id 2114
         mtu 1500
      pseudowire PW2124
         neighbor 10.255.0.12
         pseudowire-id 2124
         mtu 1500
      pseudowire PW2134
         neighbor 10.255.0.22
         pseudowire-id 2134
         mtu 1500
      pseudowire PW2144
         neighbor 10.255.0.32
         pseudowire-id 2144
         mtu 1500
!
patch panel
   patch PW2114
      connector 1 interface Ethernet4.2114
      connector 2 pseudowire ldp PW2114
   patch PW2124
      connector 1 interface Ethernet4.2124
      connector 2 pseudowire ldp PW2124
   patch PW2134
      connector 1 interface Ethernet4.2134
      connector 2 pseudowire ldp PW2134
   patch PW2144
      connector 1 interface Ethernet4.2144
      connector 2 pseudowire ldp PW2144
!
router bgp 65000
   vpws VPWS-2314
      rd 10.255.0.33:2314
      route-target import export evpn 65000:2314
      pseudowire PW2314
         evpn vpws id local 2 remote 1
   vpws VPWS-2324
      rd 10.255.0.33:2324
      route-target import export evpn 65000:2324
      pseudowire PW2324
         evpn vpws id local 2 remote 1
   vpws VPWS-2334
      rd 10.255.0.33:2334
      route-target import export evpn 65000:2334
      pseudowire PW2334
         evpn vpws id local 2 remote 1
   vpws VPWS-2344
      rd 10.255.0.33:2344
      route-target import export evpn 65000:2344
      pseudowire PW2344
         evpn vpws id local 2 remote 1
!
patch panel
   patch PW2314
      connector 1 interface Ethernet4.2314
      connector 2 pseudowire bgp vpws VPWS-2314 pseudowire PW2314
   patch PW2324
      connector 1 interface Ethernet4.2324
      connector 2 pseudowire bgp vpws VPWS-2324 pseudowire PW2324
   patch PW2334
      connector 1 interface Ethernet4.2334
      connector 2 pseudowire bgp vpws VPWS-2334 pseudowire PW2334
   patch PW2344
      connector 1 interface Ethernet4.2344
      connector 2 pseudowire bgp vpws VPWS-2344 pseudowire PW2344
!
end
