hostname {{ .ShortName }}
username admin privilege 15 secret admin
username admin ssh-key ssh-rsa  lab-validator
!
service routing protocols model multi-agent
!
{{- if .Env.CLAB_MGMT_VRF }}
vrf instance {{ .Env.CLAB_MGMT_VRF }}
!
{{end}}
{{ if .MgmtIPv4Gateway }}ip route {{ if .Env.CLAB_MGMT_VRF }}vrf {{ .Env.CLAB_MGMT_VRF }} {{end}}0.0.0.0/0 {{ .MgmtIPv4Gateway }}{{end}}
{{ if .MgmtIPv6Gateway }}ipv6 route {{ if .Env.CLAB_MGMT_VRF }}vrf {{ .Env.CLAB_MGMT_VRF }} {{end}}::0/0 {{ .MgmtIPv6Gateway }}{{end}}
!
interface {{ .MgmtIntf }}
{{ if .Env.CLAB_MGMT_VRF }}   vrf {{ .Env.CLAB_MGMT_VRF }}{{end}}
{{ if .MgmtIPv4Address }}   ip address {{ .MgmtIPv4Address }}/{{.MgmtIPv4PrefixLength}}{{end}}
{{ if .MgmtIPv6Address }}   ipv6 address {{ .MgmtIPv6Address }}/{{.MgmtIPv6PrefixLength}}{{end}}
!
management api gnmi
   transport grpc default
{{ if .Env.CLAB_MGMT_VRF }}      vrf {{ .Env.CLAB_MGMT_VRF }}{{end}}
!
management api netconf
   transport ssh default
{{ if .Env.CLAB_MGMT_VRF }}      vrf {{ .Env.CLAB_MGMT_VRF }}{{end}}
!
management api http-commands
   no shutdown
{{- if .Env.CLAB_MGMT_VRF }}
   !
   vrf {{ .Env.CLAB_MGMT_VRF }}
      no shutdown
{{end}}
!
vlan 111,220
!
mpls label range static 16 15984
mpls label range isis-sr 16000 8000
ip routing
mpls ip
vrf instance L3VPN-A
ip routing vrf L3VPN-A
vlan 110,240
!
interface Loopback0
   ip address 10.255.0.32/32
   isis enable CORE
   node-segment ipv4 index 32
!
interface Ethernet2
   description to vjunos-SW2
   no switchport
   ip address 10.1.0.11/29
   isis enable CORE
   isis hello padding disabled
   mpls ip
!
interface Ethernet1
   description to srx2
   switchport mode trunk
   switchport trunk allowed vlan 110,240
!
interface Vlan110
   vrf L3VPN-A
   ip address 10.110.0.69/30
!
router isis CORE
   net 49.0001.0000.0000.0032.00
   is-type level-2
   router-id ipv4 10.255.0.32
   address-family ipv4 unicast
   !
   segment-routing mpls
      no shutdown
!
router bgp 65000
   router-id 10.255.0.32
   no bgp default ipv4-unicast
   neighbor RR peer group
   neighbor RR remote-as 65000
   neighbor RR update-source Loopback0
   neighbor RR send-community
   neighbor 10.255.0.1 peer group RR
   neighbor 10.255.0.2 peer group RR
   !
   address-family vpn-ipv4
      neighbor RR activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
   !
   address-family evpn
      neighbor RR activate
      neighbor default encapsulation mpls next-hop-self source-interface Loopback0
   !
   vlan 240
      rd 10.255.0.32:240
      route-target both 65000:240
      redistribute learned
   !
   vrf L3VPN-A
      rd 10.255.0.32:100
      route-target import vpn-ipv4 65000:100
      route-target export vpn-ipv4 65000:100
      neighbor 10.110.0.70 remote-as 65202
      redistribute connected
      !
      address-family ipv4
         neighbor 10.110.0.70 activate
!
interface Ethernet3
   description to srx19
   switchport mode trunk
   switchport trunk allowed vlan 111,220,240
interface Vlan111
   vrf L3VPN-A
   ip address 10.111.0.77/30
router bgp 65000
   vrf L3VPN-A
      neighbor 10.111.0.78 remote-as 65319
      address-family ipv4
         neighbor 10.111.0.78 activate
!
mpls ldp
   router-id 10.255.0.32
   transport-address interface Loopback0
   interface disabled default
   no shutdown
   pseudowires
      pseudowire VPLS220-vjunos-RTR1
         neighbor 10.255.0.11
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-vjunos-RTR2
         neighbor 10.255.0.12
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-vjunos-RTR3
         neighbor 10.255.0.13
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-vjunos-RTR4
         neighbor 10.255.0.14
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-xrv-rtr2
         neighbor 10.255.0.2
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-xrv-rtr3
         neighbor 10.255.0.3
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-evo-rtr2
         neighbor 10.255.0.22
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-evo-rtr3
         neighbor 10.255.0.23
         pseudowire-id 220
         mtu 1500
      pseudowire VPLS220-CEOS3
         neighbor 10.255.0.33
         pseudowire-id 220
         mtu 1500
router vpls
   vpls VPLS-220
      vlan 220
      pseudowire ldp MESH split-horizon
         pseudowire VPLS220-vjunos-RTR1
         pseudowire VPLS220-vjunos-RTR2
         pseudowire VPLS220-vjunos-RTR3
         pseudowire VPLS220-vjunos-RTR4
         pseudowire VPLS220-xrv-rtr2
         pseudowire VPLS220-xrv-rtr3
         pseudowire VPLS220-evo-rtr2
         pseudowire VPLS220-evo-rtr3
         pseudowire VPLS220-CEOS3
!
interface Ethernet4
   description to srx14
   no switchport
interface Ethernet4.2141
   encapsulation dot1q vlan 2141
interface Ethernet4.2341
   encapsulation dot1q vlan 2341
interface Ethernet4.2142
   encapsulation dot1q vlan 2142
interface Ethernet4.2342
   encapsulation dot1q vlan 2342
interface Ethernet4.2143
   encapsulation dot1q vlan 2143
interface Ethernet4.2343
   encapsulation dot1q vlan 2343
interface Ethernet4.2144
   encapsulation dot1q vlan 2144
interface Ethernet4.2344
   encapsulation dot1q vlan 2344
exit
!
mpls ldp
   router-id 10.255.0.32
   transport-address interface Loopback0
   interface disabled default
   no shutdown
   pseudowires
      pseudowire PW2141
         neighbor 10.255.0.3
         pseudowire-id 2141
         mtu 1500
      pseudowire PW2142
         neighbor 10.255.0.13
         pseudowire-id 2142
         mtu 1500
      pseudowire PW2143
         neighbor 10.255.0.23
         pseudowire-id 2143
         mtu 1500
      pseudowire PW2144
         neighbor 10.255.0.33
         pseudowire-id 2144
         mtu 1500
!
patch panel
   patch PW2141
      connector 1 interface Ethernet4.2141
      connector 2 pseudowire ldp PW2141
   patch PW2142
      connector 1 interface Ethernet4.2142
      connector 2 pseudowire ldp PW2142
   patch PW2143
      connector 1 interface Ethernet4.2143
      connector 2 pseudowire ldp PW2143
   patch PW2144
      connector 1 interface Ethernet4.2144
      connector 2 pseudowire ldp PW2144
!
router bgp 65000
   vpws VPWS-2341
      rd 10.255.0.32:2341
      route-target import export evpn 65000:2341
      pseudowire PW2341
         evpn vpws id local 1 remote 2
   vpws VPWS-2342
      rd 10.255.0.32:2342
      route-target import export evpn 65000:2342
      pseudowire PW2342
         evpn vpws id local 1 remote 2
   vpws VPWS-2343
      rd 10.255.0.32:2343
      route-target import export evpn 65000:2343
      pseudowire PW2343
         evpn vpws id local 1 remote 2
   vpws VPWS-2344
      rd 10.255.0.32:2344
      route-target import export evpn 65000:2344
      pseudowire PW2344
         evpn vpws id local 1 remote 2
!
patch panel
   patch PW2341
      connector 1 interface Ethernet4.2341
      connector 2 pseudowire bgp vpws VPWS-2341 pseudowire PW2341
   patch PW2342
      connector 1 interface Ethernet4.2342
      connector 2 pseudowire bgp vpws VPWS-2342 pseudowire PW2342
   patch PW2343
      connector 1 interface Ethernet4.2343
      connector 2 pseudowire bgp vpws VPWS-2343 pseudowire PW2343
   patch PW2344
      connector 1 interface Ethernet4.2344
      connector 2 pseudowire bgp vpws VPWS-2344 pseudowire PW2344
!
end
