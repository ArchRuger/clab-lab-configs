security {
    zones {
        security-zone LAB {
            interfaces {
                all {
                    host-inbound-traffic {
                        system-services {
                            all;
                        }
                        protocols {
                            all;
                        }
                    }
                }
            }
        }
    }
    policies {
        default-policy {
            permit-all;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description to-vjunos-RTR3;
        vlan-tagging;
        unit 2112 {
            vlan-id 2112;
            family inet {
                address 10.21.12.2/30;
            }
        }
        unit 2122 {
            vlan-id 2122;
            family inet {
                address 10.21.22.2/30;
            }
        }
        unit 2132 {
            vlan-id 2132;
            family inet {
                address 10.21.32.2/30;
            }
        }
        unit 2142 {
            vlan-id 2142;
            family inet {
                address 10.21.42.2/30;
            }
        }
        unit 2312 {
            vlan-id 2312;
            family inet {
                address 10.23.12.2/30;
            }
        }
        unit 2322 {
            vlan-id 2322;
            family inet {
                address 10.23.22.2/30;
            }
        }
        unit 2332 {
            vlan-id 2332;
            family inet {
                address 10.23.32.2/30;
            }
        }
        unit 2342 {
            vlan-id 2342;
            family inet {
                address 10.23.42.2/30;
            }
        }
    }
}
system {
    login {
        user admin {
            authentication {
                ssh-rsa "ssh-rsa  lab-validator";
            }
        }
    }
}
