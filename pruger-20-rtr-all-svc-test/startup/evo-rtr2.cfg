routing-options {
    router-id 10.255.0.22;
    autonomous-system 65000;
}
protocols {
    mpls {
        label-range {
            srgb-label-range 16000 23999;
        }
        interface et-0/0/0.0;
    }
    isis {
        level 1 {
            disable;
        }
        level 2 {
            wide-metrics-only;
        }
        interface lo0.0 {
            passive;
        }
        source-packet-routing {
            node-segment {
                ipv4-index 22;
            }
        }
        interface et-0/0/0.0 {
            hello-padding disable;
            level 2 {
                priority 127;
            }
        }
    }
    bgp {
        group RR {
            type internal;
            local-address 10.255.0.22;
            family inet-vpn {
                unicast;
            }
            family evpn {
                signaling;
            }
            neighbor 10.255.0.1;
            neighbor 10.255.0.2;
        }
    }
    ldp {
        interface lo0.0;
    }
    l2circuit {
        neighbor 10.255.0.3 {
            interface et-0/0/3.2131 {
                virtual-circuit-id 2131;
                encapsulation-type ethernet;
                no-control-word;
                mtu 1500;
            }
        }
        neighbor 10.255.0.13 {
            interface et-0/0/3.2132 {
                virtual-circuit-id 2132;
                encapsulation-type ethernet;
                no-control-word;
                mtu 1500;
            }
        }
        neighbor 10.255.0.23 {
            interface et-0/0/3.2133 {
                virtual-circuit-id 2133;
                encapsulation-type ethernet;
                no-control-word;
                mtu 1500;
            }
        }
        neighbor 10.255.0.33 {
            interface et-0/0/3.2134 {
                virtual-circuit-id 2134;
                encapsulation-type ethernet;
                no-control-word;
                mtu 1500;
            }
        }
    }
}
routing-instances {
    L3VPN-A {
        instance-type vrf;
        interface et-0/0/1.0;
        route-distinguisher 10.255.0.22:100;
        vrf-target target:65000:100;
        vrf-table-label;
        protocols {
            bgp {
                group CE {
                    type external;
                    peer-as 65202;
                    neighbor 10.110.0.38;
                }
                group EP {
                    type external;
                    neighbor 10.111.0.82 {
                        peer-as 65320;
                    }
                }
            }
        }
        interface et-0/0/2.111;
    }
    VPLS-220 {
        instance-type vpls;
        vlan-id none;
        protocols {
            vpls {
                vpls-id 220;
                neighbor 10.255.0.11;
                neighbor 10.255.0.12;
                neighbor 10.255.0.13;
                neighbor 10.255.0.14;
                neighbor 10.255.0.2;
                neighbor 10.255.0.3;
                neighbor 10.255.0.23;
                neighbor 10.255.0.32;
                neighbor 10.255.0.33;
            }
        }
        interface et-0/0/2.220;
    }
    EVPN-240 {
        instance-type mac-vrf;
        service-type vlan-based;
        protocols {
            evpn {
                encapsulation mpls;
                control-word;
            }
        }
        route-distinguisher 10.255.0.22:240;
        vrf-target target:65000:240;
        vlans {
