logging console disable
commit
vrf L3VPN-A
 address-family ipv4 unicast
  import route-target
   65000:100
  !
  export route-target
   65000:100
  !
 !
!
interface Loopback0
 ipv4 address 10.255.0.1 255.255.255.255
!
interface Loopback100
 vrf L3VPN-A
 ipv4 address 10.100.0.1 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 description to xrv-rtr2
 ipv4 address 10.0.0.0 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/0/0/1
 description to xrv-rtr3
 ipv4 address 10.0.0.5 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/0/0/2
 description to vjunos-RTR1
 ipv4 address 10.0.0.7 255.255.255.254
 no shutdown
!
interface GigabitEthernet0/0/0/3
 description to vjunos-RTR4
 ipv4 address 10.0.0.13 255.255.255.254
 no shutdown
!
router isis CORE
 is-type level-2-only
 net 49.0001.0000.0000.0001.00
 address-family ipv4 unicast
  metric-style wide
  segment-routing mpls
 !
 interface Loopback0
  passive
  address-family ipv4 unicast
   prefix-sid index 1
  !
 !
 interface GigabitEthernet0/0/0/0
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
  !
 !
 interface GigabitEthernet0/0/0/1
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
  !
 !
 interface GigabitEthernet0/0/0/2
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
  !
 !
 interface GigabitEthernet0/0/0/3
  point-to-point
  hello-padding disable
  address-family ipv4 unicast
  !
 !
!
router bgp 65000
 bgp router-id 10.255.0.1
 address-family vpnv4 unicast
  retain route-target all
 !
 address-family l2vpn evpn
  retain route-target all
 !
 neighbor-group IBGP
  remote-as 65000
  update-source Loopback0
  address-family vpnv4 unicast
   route-reflector-client
  !
  address-family l2vpn evpn
   route-reflector-client
  !
 !
 neighbor 10.255.0.2
  use neighbor-group IBGP
 !
 neighbor 10.255.0.3
  use neighbor-group IBGP
 !
 neighbor 10.255.0.11
  use neighbor-group IBGP
 !
 neighbor 10.255.0.12
  use neighbor-group IBGP
 !
 neighbor 10.255.0.13
  use neighbor-group IBGP
 !
 neighbor 10.255.0.14
  use neighbor-group IBGP
 !
 neighbor 10.255.0.21
  use neighbor-group IBGP
 !
 neighbor 10.255.0.22
  use neighbor-group IBGP
 !
 neighbor 10.255.0.23
  use neighbor-group IBGP
 !
 neighbor 10.255.0.31
  use neighbor-group IBGP
 !
 neighbor 10.255.0.32
  use neighbor-group IBGP
 !
 neighbor 10.255.0.33
  use neighbor-group IBGP
 !
 vrf L3VPN-A
  rd 10.255.0.1:100
  address-family ipv4 unicast
   redistribute connected
  !
 !
!
