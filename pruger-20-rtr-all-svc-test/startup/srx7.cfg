security {
    zones {
        security-zone LAB {
            interfaces {
                all {
                    host-inbound-traffic {
                        system-services {
                            all;
                        }
                        protocols {
                            all;
                        }
                    }
                }
            }
        }
    }
    policies {
        default-policy {
            permit-all;
        }
    }
}
interfaces {
    ge-0/0/0 {
        description to-vjunos-RTR3;
        vlan-tagging;
        unit 111 {
            vlan-id 111;
            family inet {
                address 10.111.0.30/30;
            }
        }
        unit 220 {
            vlan-id 220;
            family inet {
                address 10.220.0.107/24;
            }
        }
        unit 240 {
            vlan-id 240;
            family inet {
                address 10.240.0.107/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 172.16.0.107/32;
            }
        }
    }
}
routing-options {
    router-id 172.16.0.107;
    autonomous-system 65307;
}
policy-options {
    policy-statement CE-LO {
        term 1 {
            from {
                route-filter 172.16.0.107/32 exact;
            }
            then {
                accept;
            }
        }
        term 2 {
            then {
                reject;
            }
        }
    }
}
protocols {
    bgp {
        group PE {
            type external;
            peer-as 65000;
            export CE-LO;
            neighbor 10.111.0.29;
        }
    }
}
system {
    login {
        user admin {
            authentication {
                ssh-rsa "ssh-rsa  lab-validator";
            }
        }
    }
}
